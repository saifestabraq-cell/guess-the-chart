  const off=state.done||!left.length||state.wrong>=3;b.disabled=off;
  b.textContent=!left.length?"Hints used":state.wrong>=3?"No hints on your last guess":"Get a hint (costs 1 guess)";
  document.querySelectorAll("#hintChoices button").forEach(x=>{x.disabled=used.includes(x.dataset.k);});if(off)$("#hintChoices").hidden=true;}
function useHint(kind){state.hintsUsed=state.hintsUsed||[];if(state.done||state.hintsUsed.includes(kind)||state.wrong>=3)return;const P=state.person;
  const txt=kind==="field"?`Best known in ${fieldOf(P[9],P[0])}.`:(WOMEN.has(P[0])?"This person is a woman.":"This person is a man.");
  state.hintsUsed.push(kind);state.wrong++;$("#hintChoices").hidden=true;addMsg("host",`Hint: ${txt}`,"hint");renderStatus();
  if(state.wrong>=4){lose();return;}updateHint();}
function updateControls(){updateHint();
  const off=state.done||state.qLeft<=0||sampleDead||!sample;
  $("#q").disabled=off; $("#askBtn").disabled=off;
  $("#q").placeholder=sampleDead||!sample?(sampleDead?"Questions unavailable here":"Connecting…"):state.qLeft<=0?"No questions left, make a guess":"Was this person an actor?";
}
function addMsg(who,text,cls=""){const el=document.createElement("div");el.className=`msg ${who} ${cls}`;el.textContent=text;$("#thread").append(el);$("#thread").scrollTop=1e9;return el;}

// ---- wheel ----
function interceptedSigns(C){if(!C.cusps)return [];const out=[];
  for(let s=0;s<12;s++){if(!C.cusps.some(c=>Math.floor(c/30)===s))out.push(s);}return out;}
function drawWheel(){
  const C=state.chart, cx=200, cy=200, R0=192, R1=162, RP=146, RA=92, RH=110;
  const rot=C.asc!=null?C.asc:0;
  const P=(lon,r)=>{const t=(lon-rot)*Math.PI/180;return [cx-r*Math.cos(t),cy+r*Math.sin(t)];};
  let s=`<circle cx="${cx}" cy="${cy}" r="${R0}" class="ring"/><circle cx="${cx}" cy="${cy}" r="${R1}" class="ring"/><circle cx="${cx}" cy="${cy}" r="${RA}" class="ring faint"/>`;
  if(C.cusps) s+=`<circle cx="${cx}" cy="${cy}" r="${(RA+RH)/2}" class="houseband" style="stroke-width:${RH-RA}px"/><circle cx="${cx}" cy="${cy}" r="${RH}" class="ring faint"/>`;
  for(let i=0;i<12;i++){const [x1,y1]=P(i*30,R1),[x2,y2]=P(i*30,R0);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ring"/>`;
    const [gx,gy]=P(i*30+15,(R0+R1)/2); s+=`<text x="${gx}" y="${gy}" class="sign el${i%4}">${SG[i]}</text>`;
    for(let k=5;k<30;k+=5){const [a,b]=P(i*30+k,R1),[c,d]=P(i*30+k,R1+(k%10?4:6));s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="tick"/>`;}}
  for(const sgn of interceptedSigns(C)){let pts=[];for(let l=sgn*30+1;l<=sgn*30+29.01;l+=1){const [x,y]=P(l,R1+4);pts.push(x.toFixed(1)+","+y.toFixed(1));}
    s+=`<polyline points="${pts.join(" ")}" class="icpt"><title>${SIGNS[sgn]} is intercepted</title></polyline>`;}
  if(C.cusps){
    C.cusps.forEach((c,i)=>{const ang=i%3===0;const [x1,y1]=P(c,RA),[x2,y2]=P(c,ang?R0+6:R1);
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${ang?"axis":"cusp"}"/>`;
      const nx=C.cusps[(i+1)%12]; const mid=c+(((nx-c)+360)%360)/2; const [hx,hy]=P(mid,(RA+RH)/2); s+=`<text x="${hx}" y="${hy}" class="hnum">${i+1}</text>`;});
    const [ax,ay]=P(C.asc,R0+10);s+=`<text x="${ax}" y="${ay}" class="axlab" text-anchor="end">AC</text>`;
    const [mx,my]=P(C.mc,R0+14);s+=`<text x="${mx}" y="${my}" class="axlab">MC</text>`;}
  // aspects
  const keys=Object.keys(BODY).filter(k=>C.bodies[k]); let asp="";
  for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++){const a=keys[i],b=keys[j]; if(a==="nn"||b==="nn"||a==="ch"||b==="ch")continue;
    let d=Math.abs(C.bodies[a].lon-C.bodies[b].lon); if(d>180)d=360-d;
    for(const [ang,kind,orb] of ASP){if(kind!=="conj"&&Math.abs(d-ang)<=orb){const [x1,y1]=P(C.bodies[a].lon,RA),[x2,y2]=P(C.bodies[b].lon,RA);asp+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="asp ${kind}"/>`;}}}
  s+=asp;
  // planets with spreading
  const list=keys.map(k=>({k,lon:C.bodies[k].lon,pl:C.bodies[k].lon})).sort((a,b)=>a.lon-b.lon);
  {const G=11,n=list.length;let bi=0,bg=-1;for(let i=0;i<n;i++){const g=((list[(i+1)%n].lon-list[i].lon)+360)%360;if(g>bg){bg=g;bi=i;}}
   const seq=[];for(let j=1;j<=n;j++)seq.push(list[(bi+j)%n]);let base=seq[0].lon;seq.forEach(o=>{o.u=o.lon;while(o.u<base)o.u+=360;});
   let cl=seq.map(o=>({items:[o]}));const pos=k=>{const m=k.items.reduce((s,o)=>s+o.u,0)/k.items.length;return k.items.map((o,j)=>m+(j-(k.items.length-1)/2)*G);};
   let changed=true;while(changed){changed=false;for(let i=0;i<cl.length-1;i++){const pa=pos(cl[i]),pb=pos(cl[i+1]);if(pb[0]-pa[pa.length-1]<G){cl.splice(i,2,{items:cl[i].items.concat(cl[i+1].items)});changed=true;break;}}}
   cl.forEach(k=>{const ps=pos(k);k.items.forEach((o,j)=>o.pl=ps[j]);});}
  for(const o of list){const [tx,ty]=P(o.lon,R1),[t2x,t2y]=P(o.lon,R1-7);s+=`<line x1="${tx}" y1="${ty}" x2="${t2x}" y2="${t2y}" class="ptick"/>`;
    const [lx,ly]=P(o.pl,RP);const [dx,dy]=P(o.pl,RP-20);const b=C.bodies[o.k];
    s+=`<g class="planet" tabindex="0"><title>${BODY[o.k][1]} ${deg(b.lon)} ${SIGNS[Math.floor(b.lon/30)]}${b.retro?", retrograde":""}</title><text x="${lx}" y="${ly}" class="pg">${BODY[o.k][0]+VS}</text><text x="${dx}" y="${dy}" class="pd">${Math.floor(b.lon%30)}${b.retro?"℞":""}</text></g>`;}
  $("#wheel").innerHTML=s;
}
function drawTable(){
  const C=state.chart; let h="";
  for(const k in BODY){const b=C.bodies[k];if(!b)continue;h+=`<tr><td class="g">${BODY[k][0]+VS}</td><td>${k==="nn"?(opts.trueNode?"North Node (true)":"North Node (mean)"):BODY[k][1]}</td><td>${deg(b.lon)} ${SIGNS[Math.floor(b.lon/30)]}${b.retro?" ℞":""}</td></tr>`;}
  if(C.asc!=null){h+=`<tr><td class="g">AC</td><td>Ascendant</td><td>${deg(C.asc)} ${SIGNS[Math.floor(C.asc/30)]}</td></tr><tr><td class="g">MC</td><td>Midheaven</td><td>${deg(C.mc)} ${SIGNS[Math.floor(C.mc/30)]}</td></tr>`;}
  const ic=interceptedSigns(C);
  if(ic.length)h+=`<tr><td class="g">↔</td><td>Intercepted</td><td>${ic.map(i=>SIGNS[i]).join(", ")}</td></tr>`;
  $("#posTable").innerHTML=h;
}

// ---- questions ----
async function ask(){
  const q=$("#q").value.trim(); if(!q||state.done||state.qLeft<=0||!sample)return;
  $("#q").value=""; addMsg("you",q); const pend=addMsg("host","Thinking…","pending");
  $("#askBtn").disabled=true;$("#q").disabled=true;
  const [name,,y,m,d,,,,jul,desc,place]=state.person;
  const prompt=`You are the host of a guessing game. The secret person is ${name} (${desc}), born ${MONTHS[m-1]} ${d}, ${yr(y)}${jul?" (Julian calendar)":""} in ${place}.
The player is trying to identify them by asking yes or no questions. Answer from well known, verifiable facts about this person. Never reveal the name, never give hints beyond the answer.
Player's question: """${q.slice(0,300)}"""
Reply with only JSON: {"answer":"yes"|"no"|"unsure"|"not_yes_no","named":true|false}
Use "unsure" only when the truth is genuinely unknown or ambiguous. Use "not_yes_no" when the question cannot be answered with yes or no. Set "named" true only if the question directly names this exact secret person as its guess (e.g. "Is it ${name.split(" ").slice(-1)[0]}?"), otherwise false.`;
  try{
    const r=await sample.json(prompt,{modelTier:"quick"});
    const ans=String(r&&r.answer||"").toLowerCase();
    if(r&&r.named===true){pend.remove();state.qLeft--;renderStatus();win();return;}
    if(ans==="not_yes_no"){pend.className="msg host";pend.textContent="That one needs a yes or no question. It didn't count.";}
    else if(ans!=="yes"&&ans!=="no"){pend.className="msg host";pend.textContent="Hard to say for this person. That one didn't count, try another angle.";}
    else{state.qLeft--; pend.className=`msg host ans ${ans}`;
      pend.textContent=ans==="yes"?"Yes.":"No.";
      if(state.qLeft===0&&!state.done)addMsg("host","That was your last question. Make your guesses.");}
  }catch(e){
    const c=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sampleDead=true;pend.className="msg host";pend.textContent="Questions need permission to use Claude. Guessing still works.";}
    else if(c==="rate_limited"){pend.className="msg host";pend.textContent="Too many questions too fast. Wait a moment and ask again; that one didn't count.";}
    else if(c==="cancelled"){pend.remove();}
    else{pend.className="msg host";pend.textContent="The answer didn't come through. Ask again; that one didn't count.";}
  }
  renderStatus(); updateControls(); if(!$("#q").disabled)$("#q").focus();
}

// ---- guesses ----
function guess(){
  const raw=$("#g").value.trim(); if(!raw||state.done)return; $("#g").value="";
  const g=normTxt(raw); const ok=state.person[11].some(a=>normTxt(a)===g)||normTxt(state.person[0])===g;
  if(ok){win();return;}
  addMsg("you",`Guess: ${raw}`,"guess");
  if(state.tried.includes(g)){addMsg("host",`You already tried ${raw}. That one didn't count.`);return;}
  state.tried.push(g); state.wrong++; renderStatus(); updateHint(); 
  if(state.wrong>=4){lose();} else addMsg("host",`Not ${raw}.`,"ans no");
}
function win(){finish(true);}
function lose(){finish(false);}
function finish(won){
  if(state.done)return;
  state.done=true;
  stats.played++; if(won){stats.solved++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.qOnSolves+=4-state.qLeft;}else stats.streak=0;
  saveStats(); renderStats(); updateControls(); renderStatus();
  const [name,,y,m,d,ut,,,jul,desc,place]=state.person; const C=state.chart;
  $("#rvResult").textContent=won?(state.wrong===0&&state.qLeft===4?"Straight from the chart. Impressive.":"You got it."):"Out of guesses. It was";
  $("#rvResult").className=won?"won":"lost";
  $("#rvMono").textContent=name.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(w=>/^[A-ZÀ-Þ]/.test(w)).map(w=>w[0]).slice(0,2).join("");
  $("#rvName").textContent=name; $("#rvDesc").textContent=desc;
  $("#rvBorn").textContent=`Born ${MONTHS[m-1]} ${d}, ${yr(y)}${jul?" (Julian calendar)":""}, ${place}. ${ut!=null?(state.person[12]&&state.person[12]!=="rec"?`Birth time rated ${state.person[12]}.`:"Recorded birth time."):"Time unknown, noon chart."}`;
  const s=k=>SIGNS[Math.floor(C.bodies[k].lon/30)];
  $("#rvBig").textContent=`Sun in ${s("su")}, Moon in ${s("mo")}`+(C.asc!=null?`, ${SIGNS[Math.floor(C.asc/30)]} rising`:"");
  $("#rvSearch").href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(name);
  $("#play").hidden=true; $("#reveal").hidden=false; $("#giveUp").hidden=true; $("#nextBtn").focus();

}

document.addEventListener("DOMContentLoaded",()=>{
  $("#askBtn").addEventListener("click",ask);
  $("#guessBtn").addEventListener("click",guess);
  $("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();ask();}});
  $("#g").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();guess();}});
  $("#nextBtn").addEventListener("click",newRound);
  $("#hintBtn").addEventListener("click",()=>{const c=$("#hintChoices");c.hidden=!c.hidden;});
  document.querySelectorAll("#hintChoices button").forEach(b=>b.addEventListener("click",()=>useHint(b.dataset.k)));
  $("#giveUp").addEventListener("click",()=>{if(!state.done)lose();});
  $("#resetStats").addEventListener("click",()=>{if(!confirm("Reset your solved count and streaks?"))return;stats={played:0,solved:0,streak:0,best:0,qOnSolves:0};saveStats();renderStats();});
  renderStats();
  $("#optDoc").checked=opts.documented;$("#optTrue").checked=opts.trueNode;
  $("#optDoc").addEventListener("change",e=>{opts.documented=e.target.checked;saveOpts();if(opts.documented&&state.person&&state.person[5]==null&&!state.done)newRound();});
  $("#optTrue").addEventListener("change",e=>{opts.trueNode=e.target.checked;saveOpts();if(state.chart){prepChart();drawWheel();drawTable();}});
  newRound();
  (async()=>{try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){sample=null;}
    if(!sample){sampleDead=true;$("#thread").firstChild&&($("#thread").firstChild.textContent="Questions need Claude, which isn't available in this view. You can still guess.");}
    updateControls();})();
});
</script></body></html>
